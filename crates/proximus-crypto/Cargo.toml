[package]
name = "proximus-crypto"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
getrandom = "=0.2.17"
zeroize = "=1.9.0"
bip39 = { version = "=3.0.0", features = ["zeroize"] }
bitcoin = "=0.32.102"
bs58 = "=0.5.1"
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
monero = { version = "=0.22.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
