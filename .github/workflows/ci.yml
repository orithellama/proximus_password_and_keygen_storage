name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build cryptography and generate project
        run: bash scripts/bootstrap.sh
      - name: Verify and compile all Apple targets
        run: bash scripts/verify.sh --apple
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false
      - run: go test -race ./...
        working-directory: services
      - run: go vet ./...
        working-directory: services
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: services
