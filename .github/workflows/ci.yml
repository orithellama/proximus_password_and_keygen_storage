name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Browser permission, form, and authorization regression tests
        run: node --test extension/tests/*.test.js
      - name: Check browser installer
        run: python3 -m unittest discover -s extension/tests -p 'test_*.py'
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, Node 24
        with:
          go-version-file: services/go.mod
          cache: false
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: Check known Rust advisories
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Build cryptography and generate project
        run: bash scripts/bootstrap.sh
      - name: Verify and compile all Apple targets
        run: bash scripts/verify.sh --apple
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, Node 24
        with:
          go-version-file: services/go.mod
          cache: false
      - run: go test -race ./...
        working-directory: services
      - run: go vet ./...
        working-directory: services
      - run: GOTOOLCHAIN="$(go env GOVERSION)" go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: services
